<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('ridingo_theme_pref') || 'light';
          var isDark = false;
          if (pref === 'dark') {
            isDark = true;
          } else if (pref === 'light') {
            isDark = false;
          } else if (pref === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = false;
          }
          var themeVal = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', themeVal);
          document.documentElement.style.colorScheme = themeVal;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0A0A0B' : '#FFFFFF');
          }

          // Initialize clean full-screen preview state
          var search = (window.location.search || '').toLowerCase();
          var path = (window.location.pathname || '').toLowerCase();
          var isDriver = (typeof window !== 'undefined' && window.RIDINGO_TARGET === 'driver') ||
            search.includes('app=driver') ||
            search.includes('view=driver') ||
            path.includes('/driver') ||
            (window.location.hash || '').toLowerCase().includes('driver');

          document.documentElement.classList.add('standalone-app');
          if (isDriver) {
            document.documentElement.classList.add('standalone-driver');
            document.documentElement.classList.remove('standalone-user');
          } else {
            document.documentElement.classList.add('standalone-user');
            document.documentElement.classList.remove('standalone-driver');
          }
        } catch (e) {}
      })();
    </script>
    <title>Ridingo - On-demand Driver Service</title>
    <link rel="icon" type="image/png" href="/App icon.png" />
    <link rel="apple-touch-icon" href="/App icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      // Gracefully handle Google Maps API key auth/billing failures without Google's default alert dialog
      window.gm_authFailure = function() {
        console.warn('[GoogleMaps] Google Maps API key notice: Places API or billing is not yet activated on Google Cloud Console. Seamlessly falling back to high-speed local places & Nominatim routing.');
      };
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4h9iZeICidnBBQSiP0wCJo-TX_GxkxNM&libraries=places,geometry" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style id="app-splash-styles">
      .app-splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FFFFFF;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: auto;
      }

      /* Dark mode background */
      [data-theme="dark"] .app-splash-overlay,
      html[data-theme="dark"] .app-splash-overlay,
      body[data-theme="dark"] .app-splash-overlay {
        background: #090A0E;
      }

      .app-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        transform: translateY(-8px);
      }

      .app-splash-logo {
        height: 44px;
        width: auto;
        max-width: 220px;
        object-fit: contain;
        display: none;
        animation: splashLogoEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* Light mode: Black logo */
      .app-splash-overlay .splash-logo-light {
        display: block;
      }

      /* Dark mode: White logo */
      [data-theme="dark"] .app-splash-overlay .splash-logo-light,
      html[data-theme="dark"] .app-splash-overlay .splash-logo-light,
      body[data-theme="dark"] .app-splash-overlay .splash-logo-light {
        display: none !important;
      }

      [data-theme="dark"] .app-splash-overlay .splash-logo-dark,
      html[data-theme="dark"] .app-splash-overlay .splash-logo-dark,
      body[data-theme="dark"] .app-splash-overlay .splash-logo-dark {
        display: block !important;
      }

      /* Minimal Modern Premium Loading Bar Animation */
      .app-splash-loader-track {
        width: 140px;
        height: 3px;
        background: rgba(0, 0, 0, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      [data-theme="dark"] .app-splash-loader-track,
      html[data-theme="dark"] .app-splash-loader-track,
      body[data-theme="dark"] .app-splash-loader-track {
        background: rgba(255, 255, 255, 0.12);
      }

      .app-splash-loader-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #FFC70A 0%, #FFA800 100%);
        box-shadow: 0 0 10px rgba(255, 199, 10, 0.55);
        animation: splashShimmer 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes splashShimmer {
        0% {
          left: -45%;
          width: 35%;
        }
        50% {
          width: 55%;
        }
        100% {
          left: 110%;
          width: 35%;
        }
      }

      @keyframes splashLogoEnter {
        0% {
          opacity: 0;
          transform: scale(0.94);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .app-splash-overlay.splash-fade-out {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="standalone-app">
    <!-- App Refresh Premium Splash Screen -->
    <div id="app-splash-screen" class="app-splash-overlay" aria-hidden="true">
      <div class="app-splash-content">
        <img class="app-splash-logo splash-logo-dark" src="/Ridingo White.png" alt="Ridingo" />
        <img class="app-splash-logo splash-logo-light" src="/Ridingo Black.png" alt="Ridingo" />

        <div class="app-splash-loader-track">
          <div class="app-splash-loader-fill"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.info('[PWA] ServiceWorker registered:', reg.scope);
          }).catch(function(err) {
            console.warn('[PWA] ServiceWorker registration notice:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
