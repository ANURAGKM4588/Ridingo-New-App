<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('ridingo_theme_pref') || 'light';
          var isDark = false;
          if (pref === 'dark') {
            isDark = true;
          } else if (pref === 'light') {
            isDark = false;
          } else if (pref === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = false;
          }
          var themeVal = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', themeVal);
          document.documentElement.style.colorScheme = themeVal;
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', isDark ? '#0A0A0B' : '#FFFFFF');
          }

          // Initialize clean full-screen preview state
          var search = (window.location.search || '').toLowerCase();
          var path = (window.location.pathname || '').toLowerCase();
          var isDriver = search.includes('app=driver') || path.includes('/driver');
          document.documentElement.classList.add('standalone-app');
          document.documentElement.classList.add(isDriver ? 'standalone-driver' : 'standalone-user');
        } catch (e) {}
      })();
    </script>
    <title>Ridingo - On-demand Driver Service</title>
    <link rel="icon" type="image/png" href="/App icon.png" />
    <link rel="apple-touch-icon" href="/App icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      // Gracefully handle Google Maps API key auth/billing failures without Google's default alert dialog
      window.gm_authFailure = function() {
        console.warn('[GoogleMaps] Google Maps API key notice: Places API or billing is not yet activated on Google Cloud Console. Seamlessly falling back to high-speed local places & Nominatim routing.');
      };
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4h9iZeICidnBBQSiP0wCJo-TX_GxkxNM&libraries=places,geometry" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://mercury-uat.phonepe.com/web/bundle/checkout.js"></script>
  </head>
  <body class="standalone-app">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
