name: Build Flutter Production Packages (iOS & Android)

on:
  push:
    paths:
      - 'ridingo_flutter/**'
      - '.github/workflows/build-flutter.yml'
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================
  # 1. ANDROID BUILDS: Ridingo-User.apk & Ridingo-Driver.apk
  # =============================================================
  build-android:
    name: Build Flutter Android APKs (User & Driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter SDK
        run: flutter --version

      - name: Scaffold & Build Ridingo User Android APK
        run: |
          cd ridingo_flutter/ridingo_user
          cp pubspec.yaml /tmp/user_pubspec.yaml
          flutter create . --platforms=android,ios --org com.ridingo --project-name ridingo_user
          cp -f /tmp/user_pubspec.yaml pubspec.yaml
          flutter pub get
          flutter build apk --release || flutter build apk
          mkdir -p "${{ github.workspace }}/build-outputs"
          APK_FILE=$(find build/app/outputs/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" "${{ github.workspace }}/build-outputs/Ridingo-User.apk"

      - name: Scaffold & Build Ridingo Driver Android APK
        run: |
          cd ridingo_flutter/ridingo_driver
          cp pubspec.yaml /tmp/driver_pubspec.yaml
          flutter create . --platforms=android,ios --org com.ridingo --project-name ridingo_driver
          cp -f /tmp/driver_pubspec.yaml pubspec.yaml
          flutter pub get
          flutter build apk --release || flutter build apk
          mkdir -p "${{ github.workspace }}/build-outputs"
          APK_FILE=$(find build/app/outputs/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" "${{ github.workspace }}/build-outputs/Ridingo-Driver.apk"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apks
          path: |
            build-outputs/Ridingo-User.apk
            build-outputs/Ridingo-Driver.apk

  # =============================================================
  # 2. iOS BUILDS: Ridingo-User.ipa & Ridingo-Driver.ipa
  # =============================================================
  build-ios:
    name: Build Flutter iOS IPAs (User & Driver)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Xcode
        run: |
          flutter --version
          xcodebuild -version

      - name: Scaffold & Build Ridingo User iOS IPA
        run: |
          cd ridingo_flutter/ridingo_user
          cp pubspec.yaml /tmp/user_pubspec_ios.yaml
          flutter create . --platforms=android,ios --org com.ridingo --project-name ridingo_user
          cp -f /tmp/user_pubspec_ios.yaml pubspec.yaml
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
          flutter pub get
          flutter build ios --no-codesign --release
          
          # Package Payload into standard .ipa archive
          mkdir -p "${{ github.workspace }}/build-outputs"
          APP_DIR=$(find build/ios -name "*.app" -type d | head -n 1)
          if [ -d "$APP_DIR" ]; then
            mkdir -p payload_tmp/Payload
            cp -R "$APP_DIR" payload_tmp/Payload/
            cd payload_tmp
            zip -r -y "${{ github.workspace }}/build-outputs/Ridingo-User.ipa" Payload
            cd ..
            rm -rf payload_tmp
          fi

      - name: Scaffold & Build Ridingo Driver iOS IPA
        run: |
          cd ridingo_flutter/ridingo_driver
          cp pubspec.yaml /tmp/driver_pubspec_ios.yaml
          flutter create . --platforms=android,ios --org com.ridingo --project-name ridingo_driver
          cp -f /tmp/driver_pubspec_ios.yaml pubspec.yaml
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
          flutter pub get
          flutter build ios --no-codesign --release

          # Package Payload into standard .ipa archive
          APP_DIR=$(find build/ios -name "*.app" -type d | head -n 1)
          if [ -d "$APP_DIR" ]; then
            mkdir -p payload_tmp/Payload
            cp -R "$APP_DIR" payload_tmp/Payload/
            cd payload_tmp
            zip -r -y "${{ github.workspace }}/build-outputs/Ridingo-Driver.ipa" Payload
            cd ..
            rm -rf payload_tmp
          fi

      - name: Upload iOS IPAs
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-ipas
          path: |
            build-outputs/Ridingo-User.ipa
            build-outputs/Ridingo-Driver.ipa

  # =============================================================
  # 3. RELEASE: Consolidate & Publish GitHub Release
  # =============================================================
  release:
    name: Package & Publish Flutter Mobile Suite
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: flutter-android-apks
          path: release-packages

      - name: Download iOS IPAs
        uses: actions/download-artifact@v4
        with:
          name: flutter-ios-ipas
          path: release-packages

      - name: Verify All 4 Flutter Packages
        run: |
          ls -la release-packages
          test -f release-packages/Ridingo-User.apk
          test -f release-packages/Ridingo-Driver.apk
          test -f release-packages/Ridingo-User.ipa
          test -f release-packages/Ridingo-Driver.ipa
          echo "All 4 Flutter standalone production packages verified successfully!"

      - name: Create GitHub Release with 4 Flutter Packages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-flutter-${{ github.run_number }}
          name: Ridingo Flutter Production Release #${{ github.run_number }}
          body: |
            ### Ridingo Flutter Native Mobile Production Packages (iOS & Android)

            Complete Flutter rewrite using Riverpod & Supabase Realtime:

            | Application | Platform | Package File | Bundle / Application ID |
            | :--- | :--- | :--- | :--- |
            | **Ridingo (User App)** | Android | `Ridingo-User.apk` | `com.ridingo.ridingo_user` |
            | **Ridingo (User App)** | iOS | `Ridingo-User.ipa` | `com.ridingo.ridingo_user` |
            | **Ridingo Driver** | Android | `Ridingo-Driver.apk` | `com.ridingo.ridingo_driver` |
            | **Ridingo Driver** | iOS | `Ridingo-Driver.ipa` | `com.ridingo.ridingo_driver` |

            - Built with Flutter 3.24 & Riverpod 2.5
            - Full UI fidelity & workflows identical to original app
            - Realtime Supabase integration
          files: |
            release-packages/Ridingo-User.apk
            release-packages/Ridingo-Driver.apk
            release-packages/Ridingo-User.ipa
            release-packages/Ridingo-Driver.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
