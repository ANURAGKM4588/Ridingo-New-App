name: Build Production Mobile Packages (iOS & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================
  # 1. ANDROID BUILD: Ridingo.apk
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Sync & Build Ridingo Android APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p "${{ github.workspace }}/build-outputs"
          cp app/build/outputs/apk/debug/app-debug.apk "${{ github.workspace }}/build-outputs/Ridingo.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-Android-Package
          path: build-outputs/Ridingo.apk
          if-no-files-found: error

  # =============================================================
  # 2. IOS BUILD: Ridingo.ipa
  # =============================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Sync & Build Ridingo iOS IPA
        run: |
          npx cap sync ios
          cd ios/App
          pod install || true
          
          if [ -d "App.xcworkspace" ]; then
            TARGET_ARG="-workspace App.xcworkspace"
          else
            TARGET_ARG="-project App.xcodeproj"
          fi
          
          echo "Building using $TARGET_ARG"
          xcodebuild build \
            $TARGET_ARG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          mkdir -p "${{ github.workspace }}/build-outputs"
          zip -r -q "${{ github.workspace }}/build-outputs/Ridingo.ipa" Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-iOS-Package
          path: build-outputs/Ridingo.ipa
          if-no-files-found: error

  # =============================================================
  # 3. CONSOLIDATED PRODUCTION RELEASE
  # =============================================================
  consolidate-suite:
    name: Consolidate Mobile Packages
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Create release directory
        run: mkdir -p release-packages

      - name: Download Android Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Ridingo-Android-Package
          path: release-packages

      - name: Download iOS Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Ridingo-iOS-Package
          path: release-packages

      - name: Verify Packages Exist
        run: |
          echo "Listing all generated mobile packages:"
          ls -lh release-packages

      - name: Upload Complete Package Suite
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-Complete-Mobile-Suite
          path: release-packages/*

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: Ridingo Mobile Production Release #${{ github.run_number }}
          body: |
            ### Ridingo Mobile Production Packages (iOS & Android)

            | Application | Platform | Package File | Application ID |
            | :--- | :--- | :--- | :--- |
            | **Ridingo** | Android | `Ridingo.apk` | `com.ridingo.app` |
            | **Ridingo** | iOS | `Ridingo.ipa` | `com.ridingo.app` |

            - Built from commit: `${{ github.sha }}`
          files: release-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
