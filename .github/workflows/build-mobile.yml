name: Build Production Mobile Packages (iOS & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================
  # 1. ANDROID BUILDS: Ridingo-User.apk & Ridingo-Driver.apk
  # =============================================================
  build-android:
    name: Build Android APKs (User & Driver)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Distributions (dist/user & dist/driver)
        run: node scripts/build-apps.js

      # --- Build User App Android ---
      - name: Sync & Build Ridingo-User.apk
        run: |
          cd packages/user
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../../../build-outputs
          cp app/build/outputs/apk/debug/app-debug.apk ../../../build-outputs/Ridingo-User.apk

      # --- Build Driver App Android ---
      - name: Sync & Build Ridingo-Driver.apk
        run: |
          cd packages/driver
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p ../../../build-outputs
          cp app/build/outputs/apk/debug/app-debug.apk ../../../build-outputs/Ridingo-Driver.apk

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-Android-Packages
          path: |
            build-outputs/Ridingo-User.apk
            build-outputs/Ridingo-Driver.apk
          if-no-files-found: error

  # =============================================================
  # 2. IOS BUILDS: Ridingo-User.ipa & Ridingo-Driver.ipa
  # =============================================================
  build-ios:
    name: Build iOS IPAs (User & Driver)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Distributions (dist/user & dist/driver)
        run: node scripts/build-apps.js

      # --- Build User App iOS ---
      - name: Sync & Build Ridingo-User.ipa
        run: |
          cd packages/user
          npx cap sync ios
          cd ios/App
          pod install || true
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          mkdir -p ../../../build-outputs
          zip -r -q ../../../build-outputs/Ridingo-User.ipa Payload

      # --- Build Driver App iOS ---
      - name: Sync & Build Ridingo-Driver.ipa
        run: |
          cd packages/driver
          npx cap sync ios
          cd ios/App
          pod install || true
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          mkdir -p ../../../build-outputs
          zip -r -q ../../../build-outputs/Ridingo-Driver.ipa Payload

      - name: Upload iOS IPAs
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-iOS-Packages
          path: |
            build-outputs/Ridingo-User.ipa
            build-outputs/Ridingo-Driver.ipa
          if-no-files-found: error

  # =============================================================
  # 3. CONSOLIDATED PRODUCTION SUITE (All 4 Packages)
  # =============================================================
  consolidate-suite:
    name: Consolidate 4 Production Packages
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Ridingo-Android-Packages
          path: release-packages

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Ridingo-iOS-Packages
          path: release-packages

      - name: Verify All 4 Packages Exist
        run: |
          echo "Listing all generated standalone mobile packages:"
          ls -lh release-packages
          test -f release-packages/Ridingo-User.apk
          test -f release-packages/Ridingo-Driver.apk
          test -f release-packages/Ridingo-User.ipa
          test -f release-packages/Ridingo-Driver.ipa
          echo "All 4 standalone packages verified successfully!"

      - name: Upload Complete 4-Package Suite
        uses: actions/upload-artifact@v4
        with:
          name: Ridingo-Complete-Mobile-Suite-All-4-Packages
          path: release-packages/*

      - name: Create GitHub Release with 4 Mobile Packages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build-${{ github.run_number }}
          name: Ridingo Mobile Production Release #${{ github.run_number }}
          body: |
            ### Ridingo Native Mobile Production Packages (iOS & Android)

            This release provides the 4 standalone, non-conflicting mobile packages for Ridingo:

            | Application | Platform | Package File | Bundle / Application ID |
            | :--- | :--- | :--- | :--- |
            | **Ridingo (User App)** | Android | `Ridingo-User.apk` | `com.ridingo.user` |
            | **Ridingo (User App)** | iOS | `Ridingo-User.ipa` | `com.ridingo.user` |
            | **Ridingo Driver** | Android | `Ridingo-Driver.apk` | `com.ridingo.driver` |
            | **Ridingo Driver** | iOS | `Ridingo-Driver.ipa` | `com.ridingo.driver` |

            - Built from commit: `${{ github.sha }}`
            - Clean Native Full-Screen UI (dynamic island / mockups removed)
            - Safe-area inset enabled
          files: |
            release-packages/Ridingo-User.apk
            release-packages/Ridingo-Driver.apk
            release-packages/Ridingo-User.ipa
            release-packages/Ridingo-Driver.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
