# ==============================================================================
# Codemagic CI/CD Pipeline Configuration
# Multi-Workflow setup for Ridingo Flutter Suite (User & Driver iOS IPAs)
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # 1. Complete Suite: Builds Release IPAs for both Ridingo User & Driver
  # ----------------------------------------------------------------------------
  ridingo-flutter-release-suite:
    name: Ridingo Suite - Both User & Driver Release IPAs
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Verify Environment & Flutter Tools
        script: |
          echo "Build Directory: $CM_BUILD_DIR"
          flutter --version
          xcodebuild -version

      # --- 1. BUILD RIDINGO USER APP (iOS) ---
      - name: Scaffold & Prepare Ridingo User iOS
        script: |
          cd ridingo_flutter/ridingo_user
          cp pubspec.yaml /tmp/user_pubspec.yaml
          flutter create . --platforms=android,ios --org com.ridingo --project-name ridingo_user
          cp -f /tmp/user_pubspec.yaml pubspec.yaml
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
          flutter pub get

      - name: Compile Ridingo User iOS App
        script: |
          cd ridingo_flutter/ridingo_user/ios
          pod install
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ../build/derived

      - name: Package Ridingo User Release IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build-outputs"
          cd ridingo_flutter/ridingo_user
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          mkdir -p payload_user/Payload
          cp -R "$APP_PATH" payload_user/Payload/
          cd payload_user
          zip -r -y "$CM_BUILD_DIR/build-outputs/Ridingo-User.ipa" Payload
          cd ..
          rm -rf payload_user
          echo "Generated: $CM_BUILD_DIR/build-outputs/Ridingo-User.ipa"

      # --- 2. BUILD RIDINGO DRIVER APP (iOS) ---
      - name: Scaffold & Prepare Ridingo Driver iOS
        script: |
          cd ridingo_flutter/ridingo_driver
          cp pubspec.yaml /tmp/driver_pubspec.yaml
          flutter create . --platforms=android,ios --org com.ridingo --project-name ridingo_driver
          cp -f /tmp/driver_pubspec.yaml pubspec.yaml
          sed -i '' "s/# platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
          flutter pub get

      - name: Compile Ridingo Driver iOS App
        script: |
          cd ridingo_flutter/ridingo_driver/ios
          pod install
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ../build/derived

      - name: Package Ridingo Driver Release IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build-outputs"
          cd ridingo_flutter/ridingo_driver
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          mkdir -p payload_driver/Payload
          cp -R "$APP_PATH" payload_driver/Payload/
          cd payload_driver
          zip -r -y "$CM_BUILD_DIR/build-outputs/Ridingo-Driver.ipa" Payload
          cd ..
          rm -rf payload_driver
          echo "Generated: $CM_BUILD_DIR/build-outputs/Ridingo-Driver.ipa"

      - name: Validate Output Artifacts
        script: |
          echo "Listing all generated IPAs in build-outputs/:"
          ls -lh "$CM_BUILD_DIR/build-outputs"
          test -f "$CM_BUILD_DIR/build-outputs/Ridingo-User.ipa"
          test -f "$CM_BUILD_DIR/build-outputs/Ridingo-Driver.ipa"
          echo "Both User and Driver IPAs successfully generated and verified!"

    artifacts:
      - build-outputs/Ridingo-User.ipa
      - build-outputs/Ridingo-Driver.ipa

  # ----------------------------------------------------------------------------
  # 2. Standalone: Ridingo User App Release IPA
