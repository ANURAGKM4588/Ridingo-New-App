      }
    }

    container.addEventListener('pointerdown', e => {
      isDown = true;
      startMouseX = e.clientX;
      startMouseY = e.clientY;
      initialPanX = panX;
      initialPanY = panY;
      container.style.cursor = 'grabbing';
      if(pin) pin.classList.add('pin-lifted');
      container.setPointerCapture(e.pointerId);
    });

    container.addEventListener('pointermove', e => {
      if(!isDown) return;
      const dx = e.clientX - startMouseX;
      const dy = e.clientY - startMouseY;
      applyPan(initialPanX + dx, initialPanY + dy);
    });

    const onUp = e => {
      if(!isDown) return;
      isDown = false;
      container.style.cursor = 'grab';
      if(pin) pin.classList.remove('pin-lifted');
    };

    container.addEventListener('pointerup', onUp);
    container.addEventListener('pointercancel', onUp);

    // Initial resolution
    applyPan(panX, panY);

    window._applyMapPickerPan = (idx) => {
      const lm = GRAPHIC_LANDMARKS[idx];
      if(!lm) return;
      const targetPanX = -(lm.x - (container.clientWidth / 2));
      const targetPanY = -(lm.y - (container.clientHeight / 2));
      svg.style.transition = 'transform .35s cubic-bezier(.2, .8, .2, 1)';
      applyPan(targetPanX, targetPanY);
      setTimeout(()=>{ svg.style.transition = 'transform .05s ease-out'; }, 360);
      document.querySelectorAll('.map-picker-chip').forEach((c, i) => c.classList.toggle('on', i === idx));
    };
  }, 60);
}

let liveMapInstance = null;
let liveCarMarker = null;
let liveRoutePolyline = null;
let liveCurrentRoutePoints = [];

function initLeafletLiveMap(t){
  if(typeof L === 'undefined') return;
  const container = document.getElementById('live-leaflet-map');
  if(!container) return;
  if(liveMapInstance){
    try{ liveMapInstance.remove(); }catch(e){}
    liveMapInstance = null;
  }

  let pCoord = [12.9719, 77.6412];
  let dCoord = [12.9352, 77.6245];
  if(t.pickup){
    const foundP = INDIAN_LANDMARKS.find(l => t.pickup.toLowerCase().includes(l.title.toLowerCase()) || l.title.toLowerCase().includes(t.pickup.toLowerCase()));
    if(foundP) pCoord = [foundP.lat, foundP.lng];
  }
  if(t.drop){
    const foundD = INDIAN_LANDMARKS.find(l => t.drop.toLowerCase().includes(l.title.toLowerCase()) || l.title.toLowerCase().includes(t.drop.toLowerCase()));
    if(foundD) dCoord = [foundD.lat, foundD.lng];
  }

  liveMapInstance = L.map(container, { zoomControl: false, maxZoom: 19, minZoom: 12 }).setView(pCoord, 16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(liveMapInstance);

  const mid1 = [pCoord[0] + (dCoord[0] - pCoord[0]) * 0.33 + 0.004, pCoord[1] + (dCoord[1] - pCoord[1]) * 0.33 - 0.003];
  const mid2 = [pCoord[0] + (dCoord[0] - pCoord[0]) * 0.66 - 0.002, pCoord[1] + (dCoord[1] - pCoord[1]) * 0.66 + 0.004];
  liveCurrentRoutePoints = [pCoord, mid1, mid2, dCoord];

  // Graphic outline dual-stroke route for minimal vector style
  L.polyline(liveCurrentRoutePoints, {
    color: '#0B0B0C',
    weight: 7,
    opacity: 0.9,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(liveMapInstance);

  liveRoutePolyline = L.polyline(liveCurrentRoutePoints, {
    color: '#FFC70A',
    weight: 4,
    opacity: 1,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(liveMapInstance);

  liveMapInstance.fitBounds(liveRoutePolyline.getBounds(), { padding: [35, 35], maxZoom: 17 });

  const pickIcon = L.divIcon({
    className: 'custom-leaflet-pin',
    html: '<div style="width:14px;height:14px;background:#34C759;border:3px solid #FFF;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35)"></div>',
    iconSize: [14, 14],
    iconAnchor: [7, 7]
  });
  L.marker(pCoord, { icon: pickIcon }).addTo(liveMapInstance);

    iconSize: [34, 34],

  liveMapInstance.fitBounds(liveRoutePolyline.getBounds(), { padding: [35, 35] });
}

function interpolatePolyline(pts, prog){
  if(!pts || !pts.length) return [12.9719, 77.6412];
  if(pts.length === 1) return pts[0];
  const idx = Math.min(pts.length - 2, Math.floor(prog * (pts.length - 1)));
  const frac = (prog * (pts.length - 1)) - idx;
  const p1 = pts[idx], p2 = pts[idx + 1];
  return [
    p1[0] + (p2[0] - p1[0]) * frac,
    p1[1] + (p2[1] - p1[1]) * frac
  ];
}

/* ── Notification permission: ask ONCE per install ──────────────────────────
   State is stored in localStorage (key: ridingo_notif_asked).
   • Survives logout → re-login: never asks again ✅
   • Cleared when user clears site data (= uninstall): asks again next launch ✅
   • If browser already granted/denied: respect that, no prompt needed ✅
───────────────────────────────────────────────────────────────────────────── */
const NOTIF_LS_KEY = 'ridingo_notif_asked';

function requestNotifPermissionOnce(){
  if(typeof window==='undefined'||!('Notification' in window))return;

  // Browser already made a decision — respect it, no need to prompt
  if(Notification.permission==='granted') return;
  if(Notification.permission==='denied'){
    // Only show the "how to re-enable" banner if we haven't shown it this session
    if(!sessionStorage.getItem('ridingo_denied_shown')){
      sessionStorage.setItem('ridingo_denied_shown','1');
      showNotifDeniedBanner();
    }
    return;
  }

  // permission === 'default' (never asked)
  // Check if we already asked during a previous session (install)
  try{
    if(localStorage.getItem(NOTIF_LS_KEY)) return; // already asked — skip forever
  }catch(e){}

  // First time asking — mark it in localStorage so we never ask again
  try{ localStorage.setItem(NOTIF_LS_KEY,'1'); }catch(e){}

  Notification.requestPermission().then(p=>{
    if(p==='granted'){
      showNotifGrantedBanner();
    } else if(p==='denied'){
      showNotifDeniedBanner();
    }
  }).catch(()=>{});
}

function applyNativeTheme(v){
  const effectiveTheme = (v === 'system')
    ? ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light')
    : v;
  const isDark = effectiveTheme === 'dark';
  const bgColor = isDark ? '#000000' : '#FFFFFF';
  const barStyle = isDark ? 'black-translucent' : 'default';

  // 1. Update <meta name="theme-color">
  let metaTheme = document.querySelector('meta[name="theme-color"]');
  if(!metaTheme){
    metaTheme = document.createElement('meta');
    metaTheme.name = 'theme-color';
    document.head.appendChild(metaTheme);
  }
  metaTheme.content = bgColor;

  // 2. Update <meta name="apple-mobile-web-app-status-bar-style">
  let metaApple = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if(!metaApple){
    metaApple = document.createElement('meta');
    metaApple.name = 'apple-mobile-web-app-status-bar-style';
    document.head.appendChild(metaApple);
  }
  metaApple.content = barStyle;

  // 3. Update Capacitor Native StatusBar (iOS notch & Android status bar)
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar){
      const SB = window.Capacitor.Plugins.StatusBar;
      // On iOS: LIGHT style renders dark text/icons (for light background)
      // DARK style renders white text/icons (for dark background)
      SB.setStyle({ style: isDark ? 'DARK' : 'LIGHT' }).catch(()=>{});
      SB.setBackgroundColor({ color: bgColor }).catch(()=>{});
      SB.setOverlaysWebView({ overlay: true }).catch(()=>{});
    }
  }catch(e){}
}

/* ---------- Live Route Coordinates & Telemetry ---------- */
const ROUTE_PTS=[
  {x:65,y:165,name:'Green Park Residency (Pickup)'},
  {x:115,y:135,name:'Outer Ring Road'},
  {x:175,y:135,name:'MG Road Junction'},
  {x:235,y:90,name:'Cyber Flyover'},
  {x:285,y:90,name:'Airport Parkway'},
  {x:325,y:45,name:'City Mall, Main Road (Destination)'}
];

function getRouteTelemetry(prog){
  prog=Math.max(0.01,Math.min(0.99,prog||0.05));
  let totalLen=0;
  const lens=[];
  for(let i=0;i<ROUTE_PTS.length-1;i++){
    const dx=ROUTE_PTS[i+1].x-ROUTE_PTS[i].x;
    const dy=ROUTE_PTS[i+1].y-ROUTE_PTS[i].y;
    const d=Math.hypot(dx,dy);
    lens.push(d);
    totalLen+=d;
  }
  const targetDist=prog*totalLen;
  let accumulated=0;
  for(let i=0;i<lens.length;i++){
    if(accumulated+lens[i]>=targetDist||i===lens.length-1){
      const segT=(targetDist-accumulated)/(lens[i]||1);
      const p0=ROUTE_PTS[i],p1=ROUTE_PTS[i+1];
      const x=p0.x+(p1.x-p0.x)*segT;
      const y=p0.y+(p1.y-p0.y)*segT;
      const angle=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;
      return {x:Math.round(x),y:Math.round(y),angle:Math.round(angle),currentStreet:p0.name};
    }
    accumulated+=lens[i];
  }
  return {x:ROUTE_PTS[0].x,y:ROUTE_PTS[0].y,angle:0,currentStreet:ROUTE_PTS[0].name};
}

let LIVE_TIMER=null;
function startLiveTracker(){
  if(LIVE_TIMER)return;
  LIVE_TIMER=setInterval(()=>{
    const activeTrips=S.trips.filter(t=>t.status==='inprogress');
    if(!activeTrips.length){
      stopLiveTracker();
      return;
    }
    activeTrips.forEach(t=>{
      if(!t.live){
        t.live={
          progress:0.1,
          speed:38,
          distTotal:parseFloat(dist(t).toFixed(1))||5.2,
          etaMins:14,
          heading:42,
          lastUpdate:Date.now()
        };
      }
      t.live.progress=Math.min(0.96,t.live.progress+0.008);
      const wave=Math.sin(Date.now()/2500);
      t.live.speed=Math.max(25,Math.min(58,Math.round(40+wave*10+(Math.random()*4-2))));
      const remaining=1-t.live.progress;
      t.live.distLeft=(t.live.distTotal*remaining).toFixed(1);
      t.live.etaMins=Math.max(1,Math.round(remaining*16));

      // 3 timing notifications: 15 min, 10 min, 5 min
      if(t.live.etaMins<=15&&!t.live.notified15){
        t.live.notified15=true;
        systemNotify('Driver Arriving in 15 Mins','Driver '+DRIVER_INFO.name+' is ~15 minutes away from your pickup location.');
        S.unotes.unshift({ts:Date.now(),title:'Driver Arriving in 15 Mins',body:DRIVER_INFO.name+' is ~15 mins away from pickup.',icon:'clock',read:false});
      }
      if(t.live.etaMins<=10&&!t.live.notified10){
        t.live.notified10=true;
        systemNotify('Driver Arriving in 10 Mins','Driver '+DRIVER_INFO.name+' is ~10 minutes away. Please be ready at pickup.');
        S.unotes.unshift({ts:Date.now(),title:'Driver Arriving in 10 Mins',body:DRIVER_INFO.name+' is ~10 mins away. Please be ready.',icon:'clock',read:false});
      }
      if(t.live.etaMins<=5&&!t.live.notified5){
        t.live.notified5=true;
        systemNotify('Driver Arriving in 5 Mins','Driver '+DRIVER_INFO.name+' is almost at your pickup location (5 mins away)!');
        S.unotes.unshift({ts:Date.now(),title:'Driver Arriving in 5 Mins',body:DRIVER_INFO.name+' is almost at your pickup (5 mins away)!',icon:'pin',read:false});
      }
    });
    updateLiveMapDOM();
  },1000);
}

function startTrip(id){
  const t=trip(id);if(!t||(t.status!=='accepted'&&t.status!=='scheduled'))return;
  if(!sameDay(t.when,Date.now())){toast('d','This trip starts on '+fmtDate(t.when),'clock');return}
  t.status='inprogress';
  t.startedAt=Date.now();
  t.live={
    progress:0.08,
    speed:38,
    distTotal:parseFloat(dist(t).toFixed(1))||5.2,
    distLeft:(parseFloat(dist(t).toFixed(1))||5.2)*0.92,
    etaMins:14,
    heading:42,
    lastUpdate:Date.now()
  };

  if(typeof navigator!=='undefined'&&navigator.geolocation){
    try{
      navigator.geolocation.getCurrentPosition(pos=>{
        if(t.live){
          t.live.mobileGps={lat:pos.coords.latitude,lng:pos.coords.longitude,speed:Math.round(pos.coords.speed?pos.coords.speed*3.6:38)};
          if(pos.coords.speed)t.live.speed=Math.round(pos.coords.speed*3.6);
        }
      },()=>{},{enableHighAccuracy:true,timeout:3000});
      if(!t.watchId){
        t.watchId=navigator.geolocation.watchPosition(pos=>{
          if(t.status==='inprogress'&&t.live){
            t.live.mobileGps={lat:pos.coords.latitude,lng:pos.coords.longitude,speed:Math.round(pos.coords.speed?pos.coords.speed*3.6:t.live.speed)};
            if(pos.coords.speed)t.live.speed=Math.round(pos.coords.speed*3.6);
          }
        },()=>{},{enableHighAccuracy:true});
      }
    }catch(ex){}
  }

  startLiveTracker();
  updateTripStatusInSupabase(t.id, 'inprogress');
  notifyUser('Trip Started · Live GPS Active','Driver '+DRIVER_INFO.name+' started trip '+t.id+' in your '+t.car.model+'. Live map tracking is now active.','car');
  render('d');
  render('u');
}

function completeTrip(id){
  const t=trip(id);if(!t||t.status!=='inprogress')return;
  t.status='completed';t.done=Date.now();
  if(t.watchId&&typeof navigator!=='undefined'&&navigator.geolocation){
    try{navigator.geolocation.clearWatch(t.watchId)}catch(e){}
    t.watchId=null;
  }
  stopLiveTracker();
  updateTripStatusInSupabase(t.id, 'completed', { done_ts: t.done });
  S.dtx.unshift({ts:t.done,type:'earning',amount:t.fare,title:t.id+' · '+CATS[t.cat].name,sub:'Rider '+t.rider.name});
  systemNotify('Trip Completed','Trip '+t.id+' has ended. Please pay balance of '+inr(t.fare-t.advance)+' to driver '+DRIVER_INFO.name+'.');
  systemNotify('Transaction: Final Settlement','Trip '+t.id+' completed. Total fare: '+inr(t.fare)+'. Advance paid: '+inr(t.advance)+'. Balance due: '+inr(t.fare-t.advance)+'.');
  notifyUser('Trip completed','Please pay the balance '+inr(t.fare-t.advance)+' to your driver.','check');
  closeSheet('u');
  render('d');
  render('u');
}
function userCancel(id){
  const t=trip(id);if(!t||!['requested','accepted','scheduled'].includes(t.status))return;
  const had=t.driver;
  t.status='cancelled';t.by='user';
  updateTripStatusInSupabase(t.id, 'cancelled', { by_who: 'user' });
  refund(t,'Trip cancelled');

  if(had)banner('d',{title:'Rider cancelled',body:'Trip '+t.id+' was cancelled.',icon:'x'});
  render('u');render('d');
}

    const m=t.title.match(/RD-\d+/);

    else if(t.type==='earning'){ loc='Trip Earning'; cat='Driver Pay'; }
    else { loc=t.title||'Wallet Transaction'; cat=t.sub||'Wallet'; }
  }
  const letter=(loc.trim().charAt(0)||'W').toUpperCase();
  const subText=cat+' · '+fmtDate(t.ts);

function updateSearchDrop(){
  const wrap=$('#u-search-wrap');
  if(!wrap)return;
  let drop=$('#u-search-drop');
  const q=(ui.u&&ui.u.searchQuery||'').trim();

  // No dropdown when search is empty or closed (no preset dropdown)
  if(!ui.u||!ui.u.searchOpen||!q){
    if(drop)drop.remove();
    const clr=wrap.querySelector('.search-clr');
    if(!q&&clr)clr.remove();
    return;
  }

  // Ensure clear button exists when typing
  let clr=wrap.querySelector('.search-clr');
  if(!clr){
    clr=document.createElement('button');
    clr.className='search-clr';
    clr.setAttribute('data-act','clearsearch');
    clr.setAttribute('aria-label','Clear search');
    clr.innerHTML='&times;';
    wrap.querySelector('.search-box').appendChild(clr);
  }

  if(!drop){
    drop=document.createElement('div');
    drop.className='search-dropdown';
    drop.id='u-search-drop';
    wrap.appendChild(drop);
  }

  searchPlaces(q, matches => {
    let html='';
    if(matches.length){
      html=matches.map(p =>
        '<button class="search-item" data-act="searchpick" data-dest="'+esc(p.title)+'" data-cat="hourly">'+
          '<span class="search-item-ic">'+getPlaceIcon(p.type)+'</span>'+
          '<div class="search-item-meta">'+
            '<div class="search-item-route">'+
              '<span class="loc-to" style="font-weight:700">'+esc(p.title)+'</span>'+
            '</div>'+
            '<span class="search-item-sub">'+esc(p.sub)+'</span>'+
          '</div>'+
          '<span class="search-item-badge">Book</span>'+
        '</button>'
      ).join('') +
      '<button class="search-item" data-act="openmappicker" data-target="drop" style="border-top:1px solid var(--line);margin-top:4px">'+
        '<span class="search-item-ic">'+ic('pin',16)+'</span>'+
        '<div class="search-item-meta">'+
          '<b style="font-size:13px;color:var(--ink)">Choose destination on map</b>'+
          '<span class="search-item-sub">Drag pin to any exact street</span>'+
        '</div>'+
        '<span class="search-item-badge" style="background:var(--yellow);color:var(--on-yellow)">Map</span>'+
      '</button>';
    } else {
      html='<div class="search-empty">'+
        '<span class="search-empty-ic">'+ic('pin',20)+'</span>'+
        '<p>Search for "'+esc(q)+'"</p>'+
        '<button class="btn primary sm" style="margin-top:8px" data-act="searchpick" data-dest="'+esc(q)+'" data-cat="hourly">Book driver to '+esc(q)+'</button>'+
      '</div>';
    }
    drop.innerHTML=html;
  });
}

const NAV={u:[['home','Home','home'],['history','History','history'],['wallet','Wallet','wallet'],['profile','Profile','user']],d:[['dash','Dashboard','grid'],['history','History','history'],['wallet','Wallet','wallet'],['profile','Profile','user']]};
function render(app){
  const el=$('#'+app+'-content');if(!el)return;
  const st=el.scrollTop,tab=ui[app].tab;
  el.innerHTML=(app==='u'?U:D)[tab]();
  el.scrollTop=st;
  const nav=$('#'+app+'-nav');
  if(!nav.dataset.built){
    nav.innerHTML=NAV[app].map(n=>'<button class="nv" aria-label="'+n[1]+'" data-act="tab" data-app="'+app+'" data-tab="'+n[0]+'"><span class="nv-i">'+ic(n[2],23)+'</span><span class="nv-l">'+n[1]+'</span></button>').join('');
    nav.dataset.built='1';
  }
  const idx=NAV[app].findIndex(n=>n[0]===tab);
  nav.querySelectorAll('.nv').forEach((b,i)=>{b.classList.toggle('on',i===idx);b.setAttribute('aria-current',String(i===idx))});
}

function bkSubmit(){
  const err=$('#bk-err');const fail=m=>{err.textContent=m;err.hidden=false};
  const c=CATS[BK.cat];
  if(!BK.pickup.trim())return fail('Enter a pickup location.');
  if((BK.cat==='airport'||BK.cat==='outstation')&&!BK.drop.trim())return fail('Enter a destination.');
  const when=bkWhen();
  if(!BK.date||!BK.time||isNaN(when))return fail('Choose a date and time.');
  if(when<Date.now()+5*60000)return fail('Choose a time at least 5 minutes from now.');
  const fare=fareOf(BK.cat,BK.qty),adv=advOf(fare);
  if(uBalance()<adv){
    systemNotify('Payment Failed','Insufficient wallet balance ('+inr(uBalance())+') for advance of '+inr(adv)+'. Please add funds.');
    return fail('Your wallet balance is too low.');
  }
  const first=S.user.name.split(/\s+/);
  const t={id:'RD-'+(++idc),cat:BK.cat,qty:BK.qty,pickup:BK.pickup.trim(),drop:BK.drop.trim(),when,mine:true,rider:{name:first[0]+(first[1]?' '+first[1][0]+'.':''),rating:4.9,phone:S.user.phone},car:{...S.user.car,trans:BK.trans||S.user.car.trans},fare,advance:adv,status:'requested',driver:null,cashback:0,by:S.user.phone};
  const cb=1+Math.floor(Math.random()*5);
  t.cashback=cb;
  const now=Date.now();
  addUtx({ts:now,type:'advance',amount:-adv,title:'Advance for '+t.id,sub:c.name+' trip'});
  addUtx({ts:now+1,type:'cashback',amount:cb,title:'Cashback on '+t.id,sub:'Booking reward'});
  S.trips.unshift(t);
  syncTripToSupabase(t);
  saveCurrentUserScopedData();
  systemNotify('Payment Successful','Advance payment of '+inr(adv)+' completed for trip '+t.id+'.');
  systemNotify('Transaction: Advance Payment',inr(adv)+' debited from your wallet for booking '+t.id+'.');
  $('#u-layer .sheet').innerHTML='<div class="grab"></div><div class="ok"><span class="ok-ic">'+ic('check',32)+'</span><h3>Request sent</h3><p>We sent your request to drivers near you. You will get a notification when a driver accepts.</p>'+

function amtGo(){
  const v=parseInt($('#amt').value,10)||0,err=$('#amt-err');
  const fail=m=>{err.textContent=m;err.hidden=false};
  if(AMT.kind==='add'){
    if(v<10){
      systemNotify('Payment Failed','Minimum top-up amount is ₹10.');
      return fail('Enter at least ₹10.');
    }
    if(v>50000){
      systemNotify('Payment Failed','Maximum wallet top-up limit is ₹50,000.');
      return fail('The most you can add at once is ₹50,000.');
    }
    addUtx({ts:Date.now(),type:'topup',amount:v,title:'Added to wallet',sub:'UPI'});
    closeSheet('u');render('u');
    systemNotify('Payment Successful',inr(v)+' added to your Ridingo Wallet successfully.');
    systemNotify('Transaction: Wallet Top-Up',inr(v)+' credited to your wallet balance.');
    ping('u');
  }else{
    if(v<100)return fail('Enter at least ₹100.');
    if(v>dAvail())return fail('That is more than your available balance.');
    S.dtx.push({ts:Date.now(),type:'withdraw',amount:-v,title:'Withdrawal to bank',sub:S.driver.bank+' · Processing'});
    closeSheet('d');render('d');banner('d',{title:inr(v)+' withdrawal started',body:'Sent to '+S.driver.bank,icon:'bank'});
  }
}

/* ---------- clock, countdown, init ---------- */
function tick(){
  const t=fmtTime(Date.now()).replace(/ (AM|PM)/,'');
  document.querySelectorAll('.clock').forEach(c=>c.textContent=t);
  const p=ui&&ui.d?ui.d.popup:null;
  if(p){
    const tr=trip(p.id);
    if(!tr||tr.status!=='requested'){closePopup();return}
    const s=Math.ceil((p.exp-Date.now())/1000);
    if(s<=0){closePopup();render('d');return}
    const a=$('#pop-sec'),b=$('#pop-bar');
    if(a)a.textContent=s+'s';
    if(b)b.style.width=(s/30*100)+'%';
  }
}
let uLastScroll=0,scrollTicking=false;
function setupScrollPhysics(){
  const uc=$('#u-content');
  if(!uc)return;
  uc.addEventListener('scroll',()=>{
    if(!scrollTicking){
      window.requestAnimationFrame(()=>{
        const wrap=$('#u-search-wrap');
        if(wrap){
          const st=uc.scrollTop;
          const delta=st-uLastScroll;

          // Apple physics: top of first page always visible
          if(st<=8){
            if(wrap.classList.contains('scrolled-hidden'))wrap.classList.remove('scrolled-hidden');
          }
          // User scrolls down: buttery smooth 200 FPS Apple spring retraction
          else if(delta>1.5&&st>18){
            if(!wrap.classList.contains('scrolled-hidden')){
              wrap.classList.add('scrolled-hidden');
              if(ui.u&&ui.u.searchOpen){
                ui.u.searchOpen=false;
                const drop=$('#u-search-drop');
                if(drop)drop.remove();
              }
              const inp=$('#u-dest-search');
              if(inp&&document.activeElement===inp)inp.blur();
            }
          }
          // User scrolls up: fluidly glide back in with zero lag
          else if(delta<-3){
            if(wrap.classList.contains('scrolled-hidden')){
              wrap.classList.remove('scrolled-hidden');
            }
          }
          uLastScroll=Math.max(0,st);
        }
        scrollTicking=false;
      });
      scrollTicking=true;
    }
  },{passive:true});
}

const RIDINGO_USER_SESSION_KEY = 'ridingo_user_session_v3';

function saveUserSession(user){
  try{
    const session = {
      phone: user.phone || '',
      name: user.name || 'Car Owner',
      email: user.email || '',
      avatar: user.avatar || null,
      car: user.car || { model: 'Hyundai Creta', plate: 'KL 07 AB 4821', trans: 'Automatic' },
      loggedIn: true,
      timestamp: Date.now()
    };
    localStorage.setItem(RIDINGO_USER_SESSION_KEY, JSON.stringify(session));
  }catch(e){
    console.warn('Could not save user session to localStorage:', e);
  }
}

function getUserSession(){
  try{
    const raw = localStorage.getItem(RIDINGO_USER_SESSION_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(parsed && parsed.loggedIn && (parsed.phone || parsed.email)){
      return parsed;
    }
  }catch(e){}
  return null;
}

function clearUserSession(){
  try{
    localStorage.removeItem(RIDINGO_USER_SESSION_KEY);
  }catch(e){}
}

async function loadUserDataForLogin(phoneOrEmail){
  const normPh = (phoneOrEmail || '').replace(/\D/g, '').slice(-10);
  const normEm = (phoneOrEmail || '').trim().toLowerCase();

  // 1. Try local user-scoped cache first for instant responsiveness
  const cached = loadUserScopedData(phoneOrEmail);
  if(cached && cached.user){
    Object.assign(S.user, cached.user);
    S.trips = Array.isArray(cached.trips) ? cached.trips.map(t => ({...t, mine: true})) : [];
    S.utx = Array.isArray(cached.utx) ? cached.utx : [];
    S.unotes = Array.isArray(cached.unotes) ? cached.unotes : [];
  } else {
    S.trips = [];
    S.utx = [];
    S.unotes = [
      { ts: Date.now(), title: 'Welcome to Ridingo', body: 'Book a driver for your own car.', icon: 'car', read: true }
    ];
  }

  // 2. Fetch latest data from Supabase
  if(sbClient && sbTablesReady){
    try{
      let profQuery = normPh 
        ? sbClient.from('profiles').select('*').ilike('phone', `*${normPh}*`).limit(1)
        : sbClient.from('profiles').select('*').ilike('email', normEm).limit(1);

      const { data: profs } = await profQuery;
      if(profs && profs.length > 0){
        const p = profs[0];
        if(p.name) S.user.name = p.name;
        if(p.phone) S.user.phone = p.phone;
        if(p.email) S.user.email = p.email;
        if(p.car) S.user.car = p.car;
        if(p.avatar) S.user.avatar = p.avatar;
        if(p.settings && typeof p.settings === 'object'){
          Object.assign(S.user, p.settings);
        }
      }

      // Trips (ONLY trips where by_who matches user's phone or email)
      const userDigits = (S.user.phone || '').replace(/\D/g, '').slice(-10);
      let tripQuery = sbClient.from('trips').select('*').order('created_at', { ascending: false });
      if(userDigits){
        tripQuery = tripQuery.or(`by_who.ilike.*${userDigits}*,rider->>phone.ilike.*${userDigits}*`);
      }
      const { data: tripData } = await tripQuery;
      if(tripData && Array.isArray(tripData)){
        S.trips = tripData.map(row => ({
          id: row.id,
          cat: row.cat,
          qty: row.qty,
          pickup: row.pickup,
          drop: row.drop_loc || '',
          when: Number(row.when_ts),
          done: Number(row.done_ts || 0),
          mine: true,
          rider: row.rider || { name: S.user.name, rating: 4.9, phone: S.user.phone },
          car: row.car || S.user.car,
          fare: row.fare,
          advance: row.advance,
          status: row.status,
          driver: row.driver,
          cashback: row.cashback || 0,
          by: row.by_who || S.user.phone
        }));
      }

      // Wallet Transactions
      if(userDigits){
        const { data: txData } = await sbClient.from('wallet_transactions').select('*').ilike('user_phone', `*${userDigits}*`).order('ts', { ascending: false });
        if(txData && Array.isArray(txData) && txData.length > 0){
          S.utx = txData.map(r => ({
            ts: Number(r.ts),
            type: r.type,
            amount: Number(r.amount),
            title: r.title,
            sub: r.sub,
            to: r.to_dest
          }));
        }
      }
    }catch(e){
      console.warn('Error loading user data from Supabase:', e);
    }
  }

  saveUserSession(S.user);
  saveCurrentUserScopedData();
}

function showOnboarding(targetStep = 'splash', tab = 'login'){
  const uc=$('#u-content'),un=$('#u-nav'),ul=$('#u-layer');
  if(!uc)return;
  uc.style.display='none';
  un.style.display='none';
  ul.innerHTML='';
  const inner=uc.parentElement;
  let ob=inner.querySelector('.ob-screen');
  if(ob)ob.remove();
  ob=document.createElement('div');
  ob.className='ob-screen';
  ob.id='ob-screen';
  inner.appendChild(ob);
  authState.step = targetStep;
  authState.authTab = tab;
  authState.errorMsg = '';
  authState.successMsg = '';
  renderOb();
}

function renderOb(){
  const ob=$('#ob-screen');
  if(!ob)return;
  if(authState.step==='splash') ob.innerHTML=obSplashHTML();
  else if(authState.step==='walk') ob.innerHTML=obWalkHTML();
  else if(authState.step==='auth') ob.innerHTML=obAuthHTML();
  else if(authState.step==='otp') ob.innerHTML=obOtpHtml();
  if(authState.step==='walk'){
    let walkIdx=ob._walkIdx||0;
    ob._walkIdx=walkIdx;
    applyWalkSlide(walkIdx);
  }
}

function startOtpTimer(){
  if(authState.timerInterval) clearInterval(authState.timerInterval);
  authState.resendTimer = 30;
  authState.timerInterval = setInterval(()=>{
    if(authState.resendTimer > 0){
      authState.resendTimer--;
      const btn = $('.ob-login-resend-btn');
      if(btn){
        btn.textContent = 'Resend OTP ' + (authState.resendTimer > 0 ? '('+authState.resendTimer+'s)' : '');
        if(authState.resendTimer === 0){
          btn.removeAttribute('disabled');
          btn.style.opacity = '1';
          btn.style.cursor = 'pointer';
        }
      }
    } else {
      clearInterval(authState.timerInterval);
    }
  }, 1000);
}

let obWalkCurSlide=0;
function applyWalkSlide(idx){
  obWalkCurSlide=idx;
  const ob=$('#ob-screen');
  if(!ob)return;
  ob._walkIdx=idx;
  const slides=ob.querySelectorAll('.ob-slide');
  const dots=ob.querySelectorAll('.ob-dot');
  slides.forEach((s,i)=>{
    s.classList.remove('active','exit-left');
    if(i<idx)s.classList.add('exit-left');
    else if(i===idx)s.classList.add('active');
    s.setAttribute('aria-hidden',i!==idx);
  });
  dots.forEach((d,i)=>{d.classList.toggle('on',i===idx)});
  const nextBtn=$('#ob-next-btn');
  if(nextBtn)nextBtn.textContent=idx===OB_SLIDES.length-1?"Let's go":'Next';
}

/* ========== AUTHENTICATION CLICK & ACTION HANDLERS ========== */
document.addEventListener('click', async e => {
  const el=e.target.closest('[data-ob]');if(!el)return;
  const v=el.dataset.ob;
  const ob=$('#ob-screen');

  if(v==='getstarted'){
    authState.step = 'walk';
    renderOb();
    applyWalkSlide(0);
  }
  else if(v==='walknext'){
    const cur = ob ? ob._walkIdx || 0 : 0;
    if(cur < OB_SLIDES.length - 1){
      applyWalkSlide(cur + 1);
    } else {
      authState.step = 'auth';
      authState.authTab = 'register';
      renderOb();
    }
  }
  else if(v==='gotologin'){
    authState.step = 'auth';
    authState.authTab = 'login';
    authState.errorMsg = '';
    renderOb();
  }
  else if(v==='gotoregister'){
    authState.step = 'auth';
    authState.authTab = 'register';
    authState.errorMsg = '';
    renderOb();
  }
  else if(v==='gotowalk'){
    authState.step = 'walk';
    renderOb();
    applyWalkSlide(0);
  }
  else if(v==='gotoauth'){
    authState.step = 'auth';
    authState.errorMsg = '';
    renderOb();
  }
  else if(v==='tablogin'){
    if(e.preventDefault) e.preventDefault();
    authState.authTab = 'login';
    authState.errorMsg = '';
    renderOb();
  }
  else if(v==='tabregister'){
    if(e.preventDefault) e.preventDefault();
    authState.authTab = 'register';
    authState.errorMsg = '';
    renderOb();
  }
  else if(v==='methodphone'){
    authState.loginMethod = 'phone';
    authState.errorMsg = '';
    renderOb();
  }
  else if(v==='methodemail'){
    authState.loginMethod = 'email';
    authState.errorMsg = '';
    renderOb();
  }
  else if(v==='fillotp'){
    // Tap-to-autofill convenience
    for(let i=0; i<6; i++){
      const c = $('#ob-otp-' + i);
      if(c) c.value = authState.activeOtp[i] || '';
    }
    const last = $('#ob-otp-5');
    if(last) last.focus();
  }

  // --- SUBMIT LOGIN ---
  else if(v==='submitlogin'){
    if(authState.isLoading) return;
    authState.errorMsg = '';

    if(authState.loginMethod === 'phone'){
      const inp = $('#ob-login-phone');
      const ph = inp ? inp.value.replace(/\D/g, '') : '';
      if(!ph || ph.length !== 10){
        authState.errorMsg = 'Please enter a valid 10-digit mobile number.';
        renderOb();
        return;
      }
      authState.loginPhone = ph;
      const fullPhone = '+91 ' + ph;
      authState.isLoading = true;
      renderOb();

      // Check if user exists in database
      let userFound = false;
      let matchedProfile = null;
      if(sbClient && sbTablesReady){
        try{
          const { data, error } = await sbClient.from('profiles').select('*').ilike('phone', `*${ph}*`).limit(1);
          if(!error && data && data.length > 0){
            userFound = true;
            matchedProfile = data[0];
          }
        }catch(err){
          console.warn('Login lookup error:', err);
        }
      } else {
        // Fallback for demo if DB offline
        userFound = true;
      }

      authState.isLoading = false;
      if(!userFound){
        authState.errorMsg = 'No account found with +91 ' + ph + '. Please switch to Create Account.';
        renderOb();
        return;
      }

      // Generate 6-digit OTP
      const otp = Math.floor(100000 + Math.random() * 900000).toString();
      authState.activeOtp = otp;
      authState.targetType = 'phone';
      authState.targetDisplay = fullPhone;
      authState.step = 'otp';
      startOtpTimer();
      renderOb();
      toast('u', 'Verification code: ' + otp, 'check');
      systemNotify('Ridingo Verification', 'Your verification code is: ' + otp);
      setTimeout(()=>{ const c0=$('#ob-otp-0'); if(c0)c0.focus(); }, 150);
    } else {
      // Email Login
      const inp = $('#ob-login-email');
      const em = inp ? inp.value.trim() : '';
      if(!em || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){
        authState.errorMsg = 'Please enter a valid email address.';
        renderOb();
        return;
      }
      authState.loginEmail = em;
      authState.isLoading = true;
      renderOb();

      let userFound = false;
      let matchedProfile = null;
      if(sbClient && sbTablesReady){
        try{
          const { data, error } = await sbClient.from('profiles').select('*').ilike('email', em).limit(1);
          if(!error && data && data.length > 0){
            userFound = true;
            matchedProfile = data[0];
          }
        }catch(err){
          console.warn('Login lookup error:', err);
        }
      } else {
        userFound = true;
      }

      authState.isLoading = false;
      if(!userFound){
        authState.errorMsg = 'No account found with ' + em + '. Please switch to Create Account.';
        renderOb();
        return;
      }

      const otp = Math.floor(100000 + Math.random() * 900000).toString();
      authState.activeOtp = otp;
      authState.targetType = 'email';
      authState.targetDisplay = em;
      authState.step = 'otp';
      startOtpTimer();
      renderOb();
      toast('u', 'Verification code: ' + otp, 'check');
      systemNotify('Ridingo Verification', 'Your verification code is: ' + otp);
      setTimeout(()=>{ const c0=$('#ob-otp-0'); if(c0)c0.focus(); }, 150);
    }
  }

  // --- SUBMIT REGISTER (CREATE ACCOUNT WITH UNIQUENESS CHECK) ---
  else if(v==='submitregister'){
    if(authState.isLoading) return;
    authState.errorMsg = '';

    const firstInp = $('#ob-reg-first');
    const lastInp = $('#ob-reg-last');
    const emailInp = $('#ob-reg-email');
    const phoneInp = $('#ob-reg-phone');

    const firstName = firstInp ? firstInp.value.trim() : '';
    const lastName = lastInp ? lastInp.value.trim() : '';
    const email = emailInp ? emailInp.value.trim() : '';
    const phone = phoneInp ? phoneInp.value.replace(/\D/g, '') : '';

    // Remember inputs
    authState.regFirstName = firstName;
    authState.regLastName = lastName;
    authState.regEmail = email;
    authState.regPhone = phone;

    if(!firstName || firstName.length < 2){
      authState.errorMsg = 'Please enter your first name (min 2 characters).';
      renderOb();
      return;
    }
    if(!lastName){
      authState.errorMsg = 'Please enter your last name.';
      renderOb();
      return;
    }
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      authState.errorMsg = 'Please enter a valid email address.';
      renderOb();
      return;
    }
    if(!phone || phone.length !== 10){
      authState.errorMsg = 'Please enter a valid 10-digit mobile number.';
      renderOb();
      return;
    }

    const fullPhone = '+91 ' + phone;
    const normEmail = email.toLowerCase();
    authState.isLoading = true;
    renderOb();

    // Check Database Uniqueness (NOT ALLOW MULTIPLE ACCOUNTS FOR SAME EMAIL OR MOBILE)
    let duplicatePhone = false;
    let duplicateEmail = false;

    if(sbClient && sbTablesReady){
      try{
        const { data, error } = await sbClient
          .from('profiles')
          .select('phone, email')
          .or(`phone.ilike.*${phone}*,email.ilike.${normEmail}`);

        if(!error && Array.isArray(data) && data.length > 0){
          data.forEach(row => {
            const rowDigits = (row.phone || '').replace(/\D/g, '');
            if(rowDigits.endsWith(phone)) duplicatePhone = true;
            if(row.email && row.email.toLowerCase() === normEmail) duplicateEmail = true;
          });
        }
      }catch(err){
        console.warn('Database uniqueness check error:', err);
      }
    }

    authState.isLoading = false;

    if(duplicatePhone){
      authState.errorMsg = '⚠️ An account with mobile number ' + fullPhone + ' already exists. Please Sign In.';
      renderOb();
      return;
    }

    if(duplicateEmail){
      authState.errorMsg = '⚠️ An account with email ' + email + ' already exists. Please Sign In.';
      renderOb();
      return;
    }

    // Uniqueness confirmed! Generate 6-digit OTP
    const otp = Math.floor(100000 + Math.random() * 900000).toString();
    authState.activeOtp = otp;
    authState.targetType = 'phone';
    authState.targetDisplay = fullPhone;
    authState.step = 'otp';
    startOtpTimer();
    renderOb();
    toast('u', 'Verification code: ' + otp, 'check');
    systemNotify('Ridingo Verification', 'Your verification code is: ' + otp);
    setTimeout(()=>{ const c0=$('#ob-otp-0'); if(c0)c0.focus(); }, 150);
  }

  // --- CONFIRM OTP ---
  else if(v==='confirmotp'){
    if(authState.isLoading) return;
    authState.errorMsg = '';

    const cells = Array.from({length:6}, (_,i) => $('#ob-otp-'+i));
    const enteredCode = cells.map(c => c ? c.value : '').join('');

    if(enteredCode.length < 6){
      authState.errorMsg = 'Please enter all 6 digits of the verification code.';
      renderOb();
      return;
    }

    // CHECK OTP: Compare against generated OTP (or master fallback 123456)
    const isCorrect = (enteredCode === authState.activeOtp) || (enteredCode === '123456');

    if(!isCorrect){
      // INCORRECT OTP: Show warning message, shake cells, retry
      authState.errorMsg = '🚨 Incorrect OTP code. Please check and try again.';
      renderOb();
      // Apply shake effect
      setTimeout(()=>{
        document.querySelectorAll('.ob-otp-cell').forEach(cell => {
          cell.classList.add('shake');
          setTimeout(()=>cell.classList.remove('shake'), 450);
        });
        const c0 = $('#ob-otp-0');
        if(c0) c0.focus();
      }, 50);
      return;
    }

    // CORRECT OTP: Navigate to Home page & Save Persistent Session
    authState.isLoading = true;
    renderOb();

    try{
      if(authState.authTab === 'register'){
        const newFullName = authState.regFirstName + ' ' + authState.regLastName;
        const newPhone = '+91 ' + authState.regPhone;
        const newEmail = authState.regEmail;
        setupFreshUserAccount(newFullName, newPhone, newEmail);
      } else {
        await loadUserDataForLogin(authState.targetType === 'phone' ? authState.loginPhone : authState.loginEmail);
      }

      // Remove onboarding overlay & unlock main UI
      const ov=$('#ob-screen');
      if(ov)ov.remove();
      const uc=$('#u-content'),un=$('#u-nav');
      if(uc)uc.style.display='';
      if(un)un.style.display='';

      toast('u', 'Welcome to Ridingo, ' + S.user.name.split(' ')[0] + '!', 'check');
      render('u');
      setupScrollPhysics();
      setTimeout(requestNotifPermissionOnce, 1500);

    }catch(err){
      console.warn('Session save error:', err);
      const ov=$('#ob-screen');
      if(ov)ov.remove();
      const uc=$('#u-content'),un=$('#u-nav');
      if(uc)uc.style.display='';
      if(un)un.style.display='';
      render('u');
    }
  }

  // --- RESEND OTP ---
  else if(v==='resendotp'){
    if(authState.resendTimer > 0) return;
    const newOtp = Math.floor(100000 + Math.random() * 900000).toString();
    authState.activeOtp = newOtp;
    startOtpTimer();
    renderOb();
    toast('u', 'New code sent: ' + newOtp, 'check');
    systemNotify('Ridingo Verification', 'Your new verification code is: ' + newOtp);
  // --- DEMO LOGIN (ACT LIKE A CORRECT AUTHENTICATED USER) ---
  else if(v==='demologin'){
    S.user = {
      name: 'Arjun Menon',
      phone: '+91 98401 23456',
      email: 'arjun.menon@example.com',
      avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
      car: { model: 'Hyundai Creta (Automatic)', plate: 'KL 07 AB 4821', trans: 'Automatic' },
      notif: true,

      liveShare: true,

      acMode: 'Chill',
      acPrecool: true,
      sosContacts: [
        { name: 'Priya Menon', relation: 'Spouse', phone: '+91 98401 98765' }
      ],

    saveUserSession(S.user);
    saveCurrentUserScopedData();

    const ov=$('#ob-screen');
    if(ov) ov.remove();
    const uc=$('#u-content'),un=$('#u-nav');
    if(uc) uc.style.display='';
    if(un) un.style.display='';

    toast('u', 'Signed in as Demo User: Arjun Menon', 'check');
    init(false);

    setTimeout(requestNotifPermissionOnce, 1500);
  }

  // --- SOCIAL LOGIN ---
  else if(v==='sociallogin'){
    const soc = el.dataset.soc || 'Google';
    const ov=$('#ob-screen');
    if(ov)ov.remove();
    const uc=$('#u-content'),un=$('#u-nav');
    if(uc)uc.style.display='';
    if(un)un.style.display='';

// OTP cell auto-advance
document.addEventListener('input', e => {
  if(!e.target.dataset || e.target.dataset.obin !== 'otp') return;
  const idx = parseInt(e.target.dataset.obidx, 10);
  const v = e.target.value.replace(/\D/g, '');
  e.target.value = v.slice(-1);
  if(v && idx < 5){
    const next = $('#ob-otp-' + (idx + 1));
    if(next) next.focus();
  }
}, true);

document.addEventListener('keydown', e => {
  if(e.target.dataset && e.target.dataset.obin === 'otp'){
    if(e.key === 'Backspace' && !e.target.value){
      const idx = parseInt(e.target.dataset.obidx, 10);
      if(idx > 0){
        const prev = $('#ob-otp-' + (idx - 1));
        if(prev){ prev.value = ''; prev.focus(); }
      }
    }
  }
}, true);

// Standalone Native App Mode Detection (Full-screen native packaging)
(function detectStandaloneApp(){
  try{
    const params = new URLSearchParams(window.location.search);
    const target = window.RIDINGO_TARGET || params.get('app');
    if(target === 'user'){
      document.body.classList.add('standalone-app', 'standalone-user');
      document.title = 'Ridingo';
      const viewseg = document.getElementById('viewseg');
      if(viewseg) viewseg.style.display = 'none';
    } else if(target === 'driver'){
      document.body.classList.add('standalone-app', 'standalone-driver');
      document.title = 'Ridingo Driver';
      const st = document.getElementById('stage');
      if(st) st.dataset.view = 'driver';
      const viewseg = document.getElementById('viewseg');
      if(viewseg) viewseg.style.display = 'none';
    }
  }catch(e){}
})();

// Prevent double-tap zoom & gesture zoom across entire app while preserving swipes & taps
(function preventDoubleTapZoom(){
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTouchEnd <= 300){
      const tag = e.target ? e.target.tagName : '';
      if(tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT'){
        e.preventDefault();
      }
    }
    lastTouchEnd = now;
  }, { passive: false });

  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function(e){ e.preventDefault(); }, { passive: false });
})();

/* ========== APP BOOTSTRAP WITH PERSISTENCE CHECK ========== */
(function bootstrapApp(){
  setupScrollPhysics();
  setInterval(tick, 1000);
  initSupabase();

  // Load and apply saved theme preference
  try{
    const savedTheme = localStorage.getItem('ridingo_theme_pref');
    if(savedTheme){
      setTheme(savedTheme, false);
    } else {
      const params = new URLSearchParams(window.location.search);
      const target = window.RIDINGO_TARGET || params.get('app');
      if(target === 'driver'){
        setTheme('dark', false);
      } else {
        setTheme('system', false);
      }
    }
  }catch(e){
    setTheme('system', false);
  }

  // Real-time system theme change listener
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if(THEME === 'system'){
        applyNativeTheme('system');
        render('u');
        render('d');
      }
    });
  }

  const params = new URLSearchParams(window.location.search);
  const target = window.RIDINGO_TARGET || params.get('app');

  if(target === 'driver'){
    // Driver App: directly mounts Driver dashboard
    render('d');
  } else {
    const saved = getUserSession();
    if(saved && saved.loggedIn && (saved.phone || saved.email)){
      // ALREADY LOGGED IN: Restore session and load user's isolated data!
      loadUserDataForLogin(saved.phone || saved.email).then(() => { render('u'); });

      const ov = document.getElementById('ob-screen');
      if(ov) ov.remove();
      const uc = $('#u-content'), un = $('#u-nav');
      if(uc) uc.style.display = '';
      if(un) un.style.display = '';

      render('u');
    } else {
      // First time / signed out: show onboarding
      showOnboarding('splash');
    }
  }
})();

})();
